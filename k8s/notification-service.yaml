apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: womenswear
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: womenswear-secrets
                  key: RABBITMQ_URL
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: womenswear-config
                  key: RABBITMQ_EXCHANGE
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: womenswear-config
                  key: RABBITMQ_QUEUE
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: womenswear
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
