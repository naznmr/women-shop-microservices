apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: womenswear
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: USER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: womenswear-secrets
                  key: USER_DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: womenswear-secrets
                  key: JWT_SECRET
            - name: JWT_ALG
              valueFrom:
                configMapKeyRef:
                  name: womenswear-config
                  key: JWT_ALG
            - name: JWT_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: womenswear-config
                  key: JWT_EXPIRE_MINUTES
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: womenswear
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
